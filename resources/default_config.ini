[DEFAULTS]
HELP_interface = "interface = <interface>. Это дефолтный интерфейс который будет выбран при запуске(если он вообще существует)"
HELP_default_mac = "<interface> = <mac>. Это дефолтные мак-адреса, привязанные к интерфейсам. Нужны чтобы если что можно было сбросить интерфейс к дефолту без поиска в списке. Профиль алиаса стандартного мак-адреса интерфейса default_<interface> создается автоматически."
interface = wlan0
wlan0 = 00:11:22:33:44:55
eth0 = AA:BB:CC:DD:EE:FF

[MAC_ALIASES]
HELP_ALIASES = "<alias> = <mac>. Эти параметры нужны для большей читаемости, чтобы было понятно, на какой мак адрес происходит смена."
Home_Router = 00:11:22:33:44:55
Work_Point = AA:BB:CC:DD:EE:FF

